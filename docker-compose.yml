# تشغيل تجريبي محلي (اختياري):
#   docker compose up --build
# ثم افتح http://localhost:8000
services:
  tv:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      CHANNEL_NAME: "قناتي HD"
      # ---- القنوات الخارجية (حتى 8) ----
      # RESTREAM_URL: "https://example.com/live/master.m3u8"
      # RESTREAM_NAME: "قناة 2"
      # RESTREAM_URL_2: "http://example.org/stream/live.ts"
      # RESTREAM_NAME_2: "قناة 3"
      # RESTREAM_TYPE_2: "ts"    # auto | hls | ts
      # ---- وسائط من رابط مباشر (بديل التورنت) ----
      # MEDIA_URL: "https://github.com/USER/REPO/releases/download/v1/movie.mp4"
      # MEDIA_MAX_MB: "2048"
    restart: unless-stopped
